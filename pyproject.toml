[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techcart"
version = "0.1.0"
description = "Agentic AI + RAG commerce platform for a computer/laptop/accessories store (Azure OpenAI, LangGraph, MCP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # core / classical ML
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pydantic>=2.6",
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  # LLM / agents
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "langsmith>=0.1",
  "openai>=1.40",
  # MCP (v2 SDK: MCPServer + Client)
  "mcp>=2.0",
  # catalog: streamed from Hugging Face (Amazon-Reviews-2023, raw_meta_Electronics parquet)
  "datasets>=3.0",
  "huggingface_hub>=0.23",
]

[project.optional-dependencies]
mlops = ["mlflow>=2.14"]
azure = ["azure-search-documents>=11.4", "azure-identity>=1.16"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
techcart = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
